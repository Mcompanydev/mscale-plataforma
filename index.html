<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MScale Plano de Ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
/* Layout: sidebar de navegação estilo Notion à esquerda, página de leitura à direita; no celular, abas no topo. Identidade única: preto, branco, magenta. */
:root{
  --bg:#0a0a0b;
  --surface:#131215;
  --surface-2:#1c1a1f;
  --line:#2a2730;
  --fg:#f7f5f8;
  --muted:#a29ca8;
  --magenta:#ff1f8f;
  --magenta-soft:rgba(255,31,143,.12);
  --ok:#3ddc97;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--magenta)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-logo{font-weight:900;font-size:20px;letter-spacing:.02em;line-height:1}
.brand-logo span{color:var(--magenta)}
.brand-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--magenta);padding:3px 7px;border-radius:4px}
.who{padding:0 8px;display:flex;flex-direction:column;gap:6px}
.who label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.who input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 11px;font:600 14px var(--font)}
.who input::placeholder{color:#6d6773}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--magenta-soft);color:var(--fg);font-weight:700}
.nav a.active .nav-ic{background:var(--magenta);color:#fff;border-color:var(--magenta)}
.nav-ic{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.nav-t{flex:1;min-width:0}
.nav-pct{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-pct.done{color:var(--ok)}
.side-prog{margin-top:auto;padding:14px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-prog .row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.side-prog .row b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--magenta);border-radius:99px;transition:width .4s ease}

/* Main */
.main{min-width:0;padding-block:48px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.crumb{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.crumb b{color:var(--magenta)}
h1{font-size:clamp(30px,5vw,44px);line-height:1.08;font-weight:900;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--magenta)}
h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0}
p{margin:0}
.lead{font-size:17px;color:#d9d4dd;max-width:62ch}

.goal{border:1px solid var(--magenta);background:var(--magenta-soft);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--magenta)}
.goal p{font-size:17px;font-weight:600;line-height:1.5}

.weekhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.done{border-color:var(--ok);color:var(--ok)}

/* Tasks */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.task[open]{border-color:#3a3540}
.task summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}
.task summary::-webkit-details-marker{display:none}
.task summary:hover{background:var(--surface-2)}
.day{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta);white-space:nowrap;min-width:64px}
.t-title{font-weight:700;font-size:15px;line-height:1.35}
.caret{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.task[open] .caret{transform:rotate(90deg);color:var(--magenta)}
.t-body{padding:4px 18px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.blk{display:flex;flex-direction:column;gap:6px;padding-top:14px}
.blk-l{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.blk-l.m{color:var(--magenta)}
.t-body ol,.t-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.t-body li::marker{color:var(--magenta);font-weight:700}
.t-body b{font-weight:700;color:#fff}
.tip{background:var(--surface-2);border-left:3px solid var(--magenta);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
.ai{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px dashed #3a3540;border-radius:10px;padding:12px 14px;font-size:14px;color:#d9d4dd}
.ai-tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;background:var(--fg);color:var(--bg);padding:3px 7px;border-radius:4px;margin-top:2px}
.quote{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.quote .q-l{font-size:11px;font-weight:800;color:var(--magenta);letter-spacing:.06em;text-transform:uppercase}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:#fff}

.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swot div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.swot div:nth-child(1){border-top:3px solid var(--magenta)}
.swot div:nth-child(2){border-top:3px solid var(--fg)}
.swot div:nth-child(3){border-top:3px solid var(--magenta)}
.swot div:nth-child(4){border-top:3px solid var(--fg)}
.swot b{font-size:13px;letter-spacing:.04em}

/* Checklist */
.card{border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.deliv{background:var(--fg);color:var(--bg);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.deliv .eyebrow{color:var(--magenta)}
.deliv p{font-weight:600;font-size:15px;line-height:1.55}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:pointer;font-weight:500}
.checks label:hover{background:var(--surface-2)}
.checks input{appearance:none;flex:none;width:20px;height:20px;border:2px solid #4a4450;border-radius:6px;margin-top:2px;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.checks input:checked{background:var(--magenta);border-color:var(--magenta)}
.checks input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--magenta)}

/* Overview */
.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wk{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s}
.wk:hover{border-color:var(--magenta);transform:translateY(-2px)}
.wk-n{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);display:flex;justify-content:space-between}
.wk-n span{color:var(--muted);font-variant-numeric:tabular-nums}
.wk h3{font-size:18px;font-weight:800}
.wk p{font-size:13.5px;color:#cfcad4}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.rules .n{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--magenta)}

/* Metrics */
.metric-in{width:100%;min-width:80px;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px;font:600 13px var(--font);font-variant-numeric:tabular-nums}
.metric-in:focus{border-color:var(--magenta);outline:none}

/* Materiais */
.doc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.doc-code{flex:none;min-width:46px;height:46px;border-radius:10px;background:var(--magenta);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.doc-code.pdf{background:var(--fg);color:var(--bg);font-size:11px}
.doc-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.doc-t{font-weight:800;font-size:15px;line-height:1.3}
.doc-d{font-size:13.5px;color:#cfcad4}
.doc-meta{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;font:700 13px var(--font);text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--surface-2)}
.btn:hover{border-color:var(--magenta)}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.docs{display:flex;flex-direction:column;gap:10px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skill{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.skill code{font:700 13px var(--font);color:var(--magenta);word-break:break-word}
.skill span{font-size:13px;color:#cfcad4}
.skill small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.skills{grid-template-columns:minmax(0,1fr)}}

/* Boas-vindas e diagnóstico */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.steps li{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.steps .sn{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--magenta)}
.steps b{font-size:14.5px}
.steps span{font-size:13.5px;color:#cfcad4}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.phase{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.phase.on{border-color:var(--magenta);background:var(--magenta-soft)}
.phase .ph-n{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.phase h3{font-size:19px;font-weight:900}
.phase p{font-size:13px;color:#cfcad4}
.phase .ph-goal{font-size:12.5px;font-weight:700;color:var(--fg);margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.q{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q-t{font-weight:700;font-size:15px}
.q-t small{color:var(--magenta);font-weight:800;margin-right:8px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:9px 14px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--bg);transition:all .15s}
.opt span:hover{border-color:#5a5360}
.opt input:checked+span{background:var(--magenta);border-color:var(--magenta);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--magenta);outline-offset:2px}
.q textarea{width:100%;min-height:84px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:500 14px/1.5 var(--font)}
.q textarea:focus{outline:none;border-color:var(--magenta)}
.result{border-radius:14px;padding:22px;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;gap:10px}
.result .eyebrow{color:var(--magenta)}
.result h2{font-size:26px;font-weight:900;color:var(--bg)}
.result p{font-weight:500;font-size:14.5px}
.result .btn{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.result .btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.result-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pend{font-size:13px;color:var(--muted);font-weight:600}
.trail{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:tr}
.trail li{counter-increment:tr;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid #e3dfe6;border-radius:10px;padding:12px 14px}
.trail li::before{content:counter(tr);width:30px;height:30px;border-radius:8px;background:#0a0a0b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.trail .tr-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.trail .tr-main b{font-size:14.5px;color:#0a0a0b}
.trail .tr-main span{font-size:13px;color:#4a4450;font-weight:500}
.trail a.tr-go{font:700 12.5px var(--font);color:#fff;background:#ff1f8f;border-radius:8px;padding:7px 12px;text-decoration:none;white-space:nowrap}
.trail .tr-kick{font:700 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:#7a7380;white-space:nowrap}
@media (max-width:560px){.trail li{grid-template-columns:30px minmax(0,1fr)}.trail a.tr-go,.trail .tr-kick{grid-column:2;justify-self:start}}
.trail-banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--magenta);background:var(--magenta-soft);border-radius:12px;padding:14px 18px}
.trail-banner b{font-weight:800}
#copyOut{width:100%;min-height:120px;font:500 12.5px/1.5 var(--font);border-radius:8px;border:1px solid #ccc;padding:8px;color:#111;background:#fff}
@media (max-width:700px){.phases{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:minmax(0,1fr)}}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);font-weight:700;font-size:14px;min-width:0}
.pager a:hover{border-color:var(--magenta)}
.pager a small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pager .next{margin-left:auto;text-align:right}

.foot{font-size:12px;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:column;gap:12px;padding:14px 0 10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.who{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .who{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-label{display:none}
  .nav a{flex:none;padding:7px 11px;border:1px solid var(--line)}
  .nav-pct{display:none}
  .side-prog{display:none}
  .main{padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .who-m{display:flex !important}
}
.who-m{display:none;flex-direction:column;gap:6px}
.who-m label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.who-m input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 11px;font:600 14px var(--font)}
@media (max-width:560px){
  .weeks{grid-template-columns:minmax(0,1fr)}
  .swot{grid-template-columns:minmax(0,1fr)}
  .task summary{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .day{grid-column:1;min-width:0}
  .t-title{grid-column:1}
  .caret{grid-column:2;grid-row:1 / span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo" id="logo">M<span>.</span>SCALE</div>
    </div>
    <div class="who">
      <label for="nome">Plano de ação de</label>
      <input id="nome" type="text" placeholder="Seu nome" autocomplete="off">
    </div>
    <nav class="nav" id="nav" aria-label="Seções do playbook"></nav>
    <div class="side-prog">
      <div class="row"><span>Progresso do mês</span><b id="totPct">0%</b></div>
      <div class="bar"><i id="totBar" style="width:0%"></i></div>
    </div>
  </aside>
  <main class="main"><div class="page" id="page"></div></main>
</div>

<script>
/* Materiais do Drive MScale. tipo "doc" = modelo para fazer cópia; "pdf" = só leitura */
const D = {
 "00":{code:"00",t:"[00] Posicionamento",tipo:"doc",id:"10DIwuBy-JJKD-EPbBxnn29gkZvGrskKqqYSh1oFBG9U",
   d:"Problema que você resolve, sua autoridade, seu cliente (Ponto A e Ponto B), seu mecanismo em 4 etapas, promessa e biografia.",

   c:`<p>A reunião tem 30 a 45 minutos e segue esta ordem:</p>

<li><b>Diagnóstico (15 min):</b> você pergunta e ele fala. "Qual é a situação hoje?", "O que já tentou?", "Quanto isso está te custando?", "Se resolvesse, o que mudaria?" Use o canvas do cliente para saber o que perguntar.</li>

<li><b>Solução (10 min):</b> apresente a oferta conectando cada parte a uma dor que ele falou.</li>
<li><b>Fechamento (5 min):</b> preço, formas de pagamento, e a pergunta: "faz sentido começarmos?"</li>
</ol>
<div class="tip"><b>Escreva a resposta para as 5 objeções mais comuns:</b> "está caro", "vou pensar", "preciso falar com meu sócio ou cônjuge", "não tenho tempo agora", "não sei se funciona pra mim".</div>`,

  <h2>E depois dos 30 dias?</h2>
  <ul class="rules">
   <li><span class="n">✓</span><span><b>Fechou a primeira venda:</b> você avança para a fase Tração.</span></li>
   <li><span class="n">↻</span><span><b>Ainda não fechou:</b> repete as Semanas 3 e 4 com os ajustes do encontro, sem voltar para o início.</span></li>
  </ul>
 </div>
 ${pager(i)}`;
}

function render(){
 let id=(location.hash||"#"+START).slice(1);
 let i=routes.findIndex(r=>r.id===id); if(i<0){i=0;id=routes[0].id}
 const r=routes[i];
 const page=document.getElementById("page");
 page.innerHTML = r.id==="boas-vindas"?renderBoas(): r.id==="visao"?renderVisao(): r.id==="materiais"?renderMateriais(i): r.id==="metricas"?renderMetricas(i): renderWeek(r.w,i);
 renderNav(id);
 
}

document.addEventListener("change",e=>{
 const k=e.target.dataset&&e.target.dataset.k;
 if(k!==undefined){S.checks[k]=e.target.checked;save();
  const wid=k.replace(/-\d+$/,"");const w=W.find(x=>x.id===wid);
  if(w){const p=weekPct(w);const ch=document.getElementById("wchip");if(ch){ch.textContent=`${p.d} de ${p.t} concluídas`;ch.classList.toggle("done",p.p===100)}}
  renderNav((location.hash||"#"+START).slice(1));
 }
 const q=e.target.dataset&&e.target.dataset.q;
 if(q!==undefined){S.diag=S.diag||{};S.diag[q]=Number(e.target.value);save();
  const box=document.getElementById("resBox");
  const was=diag().done;
  const html=renderBoas();const tmp=document.createElement("div");tmp.innerHTML=html;
  box.innerHTML=tmp.querySelector("#resBox").innerHTML;
  const r=diag();document.querySelectorAll(".phase").forEach((el,k)=>el.classList.toggle("on",r.done&&Object.keys(FASES)[k]===r.f));
 }
});
document.addEventListener("click",e=>{
 const cmd=e.target.dataset&&e.target.dataset.cmd;
 if(cmd){const b=e.target;const done=()=>{b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar comando",1600)};try{navigator.clipboard.writeText(cmd).then(done,()=>{b.textContent=cmd})}catch(err){b.textContent=cmd}return}
 if(e.target.id!=="copyBtn")return;
 const txt=copyText();const msg=document.getElementById("copyMsg");
 const fallback=()=>{msg.innerHTML='Selecione e copie o texto abaixo:<textarea id="copyOut" readonly></textarea>';const t=document.getElementById("copyOut");t.value=txt;t.focus();t.select();};
 try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Copiado. Cole no grupo ou leve para o kick-off.";},fallback)}catch(err){fallback()}
});
document.addEventListener("input",e=>{
 if(e.target.dataset&&e.target.dataset.m!==undefined){S.metrics[e.target.dataset.m]=e.target.value;save()}
 if(e.target.id==="q-desafio"){S.desafio=e.target.value;save()}
 if(e.target.id==="nome"||e.target.id==="nome-m"){S.nome=e.target.value;save();
  const other=document.getElementById(e.target.id==="nome"?"nome-m":"nome");if(other)other.value=S.nome;}
});
document.getElementById("nome").value=S.nome;
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
